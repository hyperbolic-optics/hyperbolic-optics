name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Run tests
      run: |
        # Goldens are an environment-pinned local refactor lock; the slow
        # FullSweep cases are deselected to keep the matrix fast.
        uv run pytest -m "not slow and not golden" --cov=hyperbolic_optics --cov-report=xml --cov-report=term

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: |
        uv sync --all-extras

    - name: Lint with ruff
      run: |
        uv run ruff check hyperbolic_optics tests

    - name: Check formatting with ruff
      run: |
        uv run ruff format --check hyperbolic_optics tests

  wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v4
    - run: uv build --wheel
    - name: Core-only installed wheel
      run: |
        uv venv --python 3.12 /tmp/ho-core
        uv pip install --python /tmp/ho-core/bin/python dist/*.whl
        /tmp/ho-core/bin/python -I scripts/check_install.py
    - name: Minimum supported integration versions
      run: |
        uv venv --python 3.12 /tmp/ho-integration
        uv pip install --python /tmp/ho-integration/bin/python dist/*.whl 'jax==0.9.2' 'gdsfactory==9.51.0' 'sax==0.18.2'
        /tmp/ho-integration/bin/python -I scripts/check_install.py --integration

  sax:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v4
    - run: uv python install 3.12
    - name: Optional SAX and minimum-JAX integration tests
      run: |
        uv run --with 'sax==0.18.2' --with 'jax==0.9.2' pytest tests/test_sax.py tests/test_metasurfaces.py tests/test_gdsfactory.py tests/test_bcm.py tests/test_rcwa.py tests/test_rcwa2d.py tests/test_modes.py -q -o addopts='' -p no:cacheprovider
