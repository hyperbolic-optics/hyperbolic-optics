name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  # Gate the upload on the suite. A release previously published whatever was
  # on the tag without running anything.
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Run tests
      run: uv run pytest -m "not slow" --no-header

    - name: Lint
      run: |
        uv run ruff check hyperbolic_optics tests
        uv run ruff format --check hyperbolic_optics tests

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: release  # This must match what you enter on PyPI
    permissions:
      id-token: write      # REQUIRED for trusted publishing

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The tag is the source of truth for what is being released. Previously the
    # version was read out of __init__.py and written straight back to it, so
    # nothing tied the upload to the tag: releasing v0.4.0 from a tree still
    # saying 0.3.0 would have published 0.3.0 under the new release. That step
    # also committed and pushed to main mid-release, which is where the
    # "Auto-update version references [skip ci]" commits on main came from.
    - name: Verify the tag matches the package version
      run: |
        PACKAGE_VERSION=$(grep -oP '__version__ = "\K[^"]+' hyperbolic_optics/__init__.py)
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        echo "package: $PACKAGE_VERSION   tag: $TAG_VERSION"
        if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $PACKAGE_VERSION."
          echo "Bump the version in the pull request preceding the tag (scripts/sync_versions.py)."
          exit 1
        fi

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.12

    - name: Build package
      run: |
        uv build
        ls -la dist/

    - name: Publish to PyPI (trusted publishing)
      run: uv publish --trusted-publishing automatic
